name: dropod

services:
  postgres:
    image: postgres:16-alpine
    container_name: dropod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dropod_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dropod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dropod_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dropod_user} -d ${POSTGRES_DB:-dropod_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dropod-network

  redis:
    image: redis:7-alpine
    container_name: dropod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dropod-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dropod-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dropod_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-dropod_pass}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - dropod-network

volumes:
  postgres_data:
    name: dropod_postgres_data
  redis_data:
    name: dropod_redis_data
  rabbitmq_data:
    name: dropod_rabbitmq_data

networks:
  dropod-network:
    name: dropod_network
    driver: bridge
